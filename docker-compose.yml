services:
  api:
    build: .
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_DSN: ${DB_DSN}
      DATABASE_NAME: ${DATABASE_NAME}
      API_KEY: ${API_KEY}
      ADMIN_KEY: ${ADMIN_KEY}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-5}
      RL_UNAUTH_MAX_REQS: ${RL_UNAUTH_MAX_REQS:-10}
      RL_UNAUTH_WINDOW: ${RL_UNAUTH_WINDOW:-5m}
      RL_UNAUTH_MAX_FAILS: ${RL_UNAUTH_MAX_FAILS:-5}
      RL_UNAUTH_BAN_DUR: ${RL_UNAUTH_BAN_DUR:-15m}
      RL_AUTH_MAX_REQS: ${RL_AUTH_MAX_REQS:-100}
      RL_AUTH_WINDOW: ${RL_AUTH_WINDOW:-1m}
      RL_AUTH_MAX_FAILS: ${RL_AUTH_MAX_FAILS:-20}
      RL_AUTH_BAN_DUR: ${RL_AUTH_BAN_DUR:-5m}
      USE_S3_API_FILE_STORAGE: ${USE_S3_API_FILE_STORAGE:-false}
      S3_API_FILE_ACCESS_KEY_ID: ${S3_API_FILE_ACCESS_KEY_ID}
      S3_API_FILE_SECRET_ACCESS_KEY: ${S3_API_FILE_SECRET_ACCESS_KEY}
      S3_API_FILE_BUCKET: ${S3_API_FILE_BUCKET}
      S3_API_FILE_REGION: ${S3_API_FILE_REGION:-auto}
      S3_API_FILE_ENDPOINT: ${S3_API_FILE_ENDPOINT}
      S3_API_FILE_ACCOUNT_ID: ${S3_API_FILE_ACCOUNT_ID}
      USE_S3_UPDATES_STORAGE: ${USE_S3_UPDATES_STORAGE:-false}
      S3_UPDATES_ACCESS_KEY_ID: ${S3_UPDATES_ACCESS_KEY_ID}
      S3_UPDATES_SECRET_ACCESS_KEY: ${S3_UPDATES_SECRET_ACCESS_KEY}
      S3_UPDATES_BUCKET: ${S3_UPDATES_BUCKET}
      S3_UPDATES_REGION: ${S3_UPDATES_REGION:-auto}
      S3_UPDATES_ENDPOINT: ${S3_UPDATES_ENDPOINT}
      S3_UPDATES_ACCOUNT_ID: ${S3_UPDATES_ACCOUNT_ID}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-lgtm:4318}
      UPDATES_ENABLED: ${UPDATES_ENABLED:-false}
      S3_UPDATES_PREFIX: ${S3_UPDATES_PREFIX:-updates}
      S3_UPDATER_PREFIX: ${S3_UPDATER_PREFIX:-updater}
    volumes:
      - logs:/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
          pids: 100
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  logs:
  grafana_data:
