  # ── Updates ───────────────────────────────────────────────

  /v2/updates/manifest:
    get:
      tags: [Updates]
      summary: Get update manifest
      description: |
        Public endpoint — no authentication required.
        Returns the current update manifest consumed by the EMLy desktop client.
        The `stableDownload` / `betaDownload` URLs point directly to S3.
        `betaVersion`, `betaDownload`, `minRequiredVersion`, and `detailedReleaseNotes`
        are omitted when not applicable.
      responses:
        "200":
          description: Update manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateManifest'
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/updates/releases:
    get:
      tags: [Updates]
      summary: List all releases
      description: Returns releases ordered by `released_at` descending. Filterable by channel.
      security:
        - AdminKey: []
      parameters:
        - name: channel
          in: query
          description: Filter by channel
          schema:
            $ref: '#/components/schemas/ReleaseChannel'
      responses:
        "200":
          description: Array of releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Release'
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Updates]
      summary: Create a new release and upload the installer
      description: |
        Accepts `multipart/form-data`. Uploads the `.exe` to R2/S3, computes
        the SHA-256 checksum server-side, and saves the release record.

        `is_stable`/`is_beta` default to `false` (i.e. archived), `severity_type`
        defaults to `none`. A release may have both `is_stable` and `is_beta`
        set to `true` at once. If `severity_type` is not `none`, the release
        will appear in `detailedReleaseNotes` in the manifest.

        Returns `503` if S3 storage is not configured on the server.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [version, file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The installer binary (.exe). Filename is stored as-is.
                version:
                  type: string
                  example: "1.7.5"
                is_stable:
                  type: string
                  enum: ["true", "false", "1", "0"]
                  default: "false"
                  description: When `true`, clears is_stable from any other release and sets this as the sole stable release
                is_beta:
                  type: string
                  enum: ["true", "false", "1", "0"]
                  default: "false"
                  description: When `true`, clears is_beta from any other release and sets this as the sole beta release. Independent of `is_stable`
                short_note:
                  type: string
                  example: "Fix critico al renderer PDF."
                severity_type:
                  $ref: '#/components/schemas/ReleaseSeverity'
                description_en:
                  type: string
                  description: Omit or leave empty to exclude from detailed notes
                  example: "Fixed a critical PDF rendering vulnerability."
                description_it:
                  type: string
                  description: Omit or leave empty to exclude from detailed notes
                  example: "Corretto un bug critico nel rendering PDF."
                is_critical:
                  type: string
                  enum: ["true", "false", "1", "0"]
                  default: "false"
                  description: When `true`, clears the critical flag from any other release and sets this as the sole critical release
                critical_version:
                  type: string
                  description: The version clients must update to when `is_critical` is true
                  example: "1.7.5"
                min_required_version:
                  type: string
                  description: Clients below this version are forced to update; omit to leave unset
                  example: "1.6.0"
                released_at:
                  type: string
                  format: date-time
                  description: ISO 8601 timestamp; defaults to current UTC time if omitted
      responses:
        "201":
          description: Release created
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "1.7.5"
                  is_stable:
                    type: boolean
                    example: false
                  is_beta:
                    type: boolean
                    example: true
                  download_filename:
                    type: string
                    example: "EMLy_Installer_1.7.5_beta.exe"
                  sha256_checksum:
                    type: string
                    example: "a3f1bc..."
        "400":
          description: Validation error or missing file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: S3 storage not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/updates/releases/{version}/download:
    get:
      tags: [Updates]
      summary: Download installer
      description: |
        Public endpoint — no authentication required.
        Proxies the installer binary from private R2/S3 storage directly to the
        client, so the bucket never needs to be exposed publicly.
        Returns `404` if the version doesn't exist in the database or the file
        is missing from storage. Returns `503` if S3 is not configured.
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: "1.7.0"
      responses:
        "200":
          description: Installer binary stream
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="EMLy_Installer_1.7.0.exe"'
            Content-Length:
              schema:
                type: integer
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Version not found or file missing from storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: S3 storage not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/updates/releases/{version}:
    put:
      tags: [Updates]
      summary: Replace all release metadata
      description: |
        Full replacement of all mutable fields. `version` and `download_filename`
        are immutable and ignored. When `is_critical` is `true` the critical flag
        and `critical_version` are cleared from every other release atomically.
        Setting `is_stable` or `is_beta` to `true` clears that flag from
        whichever other release currently holds it; the two flags are
        independent, so a release may hold both at once.
      security:
        - AdminKey: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: "1.7.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_stable:
                  type: boolean
                  default: false
                  description: When `true`, clears is_stable from any other release
                is_beta:
                  type: boolean
                  default: false
                  description: When `true`, clears is_beta from any other release. Independent of `is_stable`
                short_note:
                  type: string
                  example: "Fix critico al renderer PDF."
                severity_type:
                  $ref: '#/components/schemas/ReleaseSeverity'
                description_en:
                  type: string
                  nullable: true
                description_it:
                  type: string
                  nullable: true
                is_critical:
                  type: boolean
                  default: false
                  description: When `true`, clears the critical flag from any other release
                critical_version:
                  type: string
                  nullable: true
                  description: The version clients must update to when `is_critical` is true
                  example: "1.7.0"
                min_required_version:
                  type: string
                  nullable: true
                  example: "1.6.0"
                released_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Updated release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Updates]
      summary: Partially update release metadata
      description: |
        Updates only the fields present in the request body. When `is_critical`
        is set to `true` the critical flag and `critical_version` are cleared
        from every other release atomically.
        Setting `is_stable` or `is_beta` to `true` clears that flag from
        whichever other release currently holds it; the two flags are
        independent, so a release may hold both at once.
      security:
        - AdminKey: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: "1.7.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_stable:
                  type: boolean
                  description: When `true`, clears is_stable from any other release
                is_beta:
                  type: boolean
                  description: When `true`, clears is_beta from any other release. Independent of `is_stable`
                short_note:
                  type: string
                severity_type:
                  $ref: '#/components/schemas/ReleaseSeverity'
                description_en:
                  type: string
                  nullable: true
                description_it:
                  type: string
                  nullable: true
                is_critical:
                  type: boolean
                  description: When `true`, clears the critical flag from any other release
                critical_version:
                  type: string
                  nullable: true
                  description: The version clients must update to when `is_critical` is true
                  example: "1.7.0"
                min_required_version:
                  type: string
                  nullable: true
                  example: "1.6.0"
                released_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Updated release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        "400":
          description: Validation error or no fields provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Updates]
      summary: Delete a release
      description: |
        Removes the release record from the database **and** deletes the
        installer file from R2/S3. If the file is already absent from storage
        the deletion proceeds anyway (idempotent on the file side).
      security:
        - AdminKey: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: "1.7.4"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
        "404":
          description: Version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Storage deletion failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/updates/releases/{version}/channel:
    patch:
      tags: [Updates]
      summary: Promote or demote a release's channel membership
      description: |
        Sets `is_stable` and/or `is_beta` on a release. Setting either to
        `true` clears that flag from whichever other release currently holds
        it; the two flags are independent, so a single release may hold both
        at once (i.e. be the current stable *and* beta build simultaneously).
        Setting a flag to `false` just clears it on this release. At least
        one of `is_stable`/`is_beta` must be present.
      security:
        - AdminKey: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: "1.7.4"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_stable:
                  type: boolean
                is_beta:
                  type: boolean
              example:
                is_stable: true
                is_beta: true
      responses:
        "200":
          description: Channel flags updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "1.7.4"
                  is_stable:
                    type: boolean
                    example: true
                  is_beta:
                    type: boolean
                    example: true
        "400":
          description: Neither is_stable nor is_beta provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Updater self-update ───────────────────────────────────

  /v2/updates/manifest/updater:
    get:
      tags: [Updater]
      summary: Get the EMLy Updater's self-update manifest
      description: |
        Returns the updater build the requesting machine should install. Served
        with an identical contract by the public API and by every internal site
        mirror, so a site with no internet access can still update its updaters
        from its own mirror.

        The `download` link is derived from the request's `Host` /
        `X-Forwarded-Proto` / `X-Forwarded-Host` headers, so a mirror
        automatically hands out a link pointing at itself — no per-site
        configuration.

        **Nothing to distribute:** a `200` with an empty (or absent) `version`
        is a silent no-op client-side — no error, no retry, no toast, no event.
        It is also the kill-switch: if a release turns out to be broken, clear
        its `is_current` flag and the manifest reverts to `{"version": ""}`.
        Clients never downgrade, so rolling back means publishing a *higher*
        version carrying the previous code.

        **`404` is never returned by this implementation.** The client reads a
        404 as "this mirror does not implement the endpoint yet" and stops
        silently, which is what lets not-yet-upgraded internal mirrors coexist.
        An empty catalogue is therefore a `200`, not a `404`.

        The client also sends `X-EMLy-Hostname`, `X-EMLy-HWID`,
        `X-EMLy-ADDomain` and `X-EMLy-IntIP`, plus a
        `EMLy-Updater/<version> (contact)` User-Agent carrying the version
        currently installed on the machine. A staged rollout can be done
        entirely server-side by keying off those headers and returning
        `{"version": ""}` to machines not yet in the ring — no client change.
      security:
        - ApiKey: []
      responses:
        "200":
          description: 'Manifest, or `{"version": ""}` when there is nothing to distribute'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdaterManifest'
        "401":
          description: Missing or wrong API key — the client logs it and retries next cycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Database error — the client retries with exponential backoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/updates/download/updater/{version}:
    get:
      tags: [Updater]
      summary: Download the EMLy Updater installer
      description: |
        Public endpoint — no authentication required, matching the EMLy release
        download: the manifest's `download` link may legitimately be served
        through a mirror or CDN that does not forward the API key.

        Proxies the CI-signed `EMLyUpdater_Installer_<version>.exe` from private
        S3 storage byte for byte, so the bucket never needs to be public. The
        client verifies the SHA-256 from the manifest and refuses to run the
        file on a mismatch.
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: "1.5.0"
      responses:
        "200":
          description: Installer binary stream
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="EMLyUpdater_Installer_1.5.0.exe"'
            Content-Length:
              schema:
                type: integer
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Version not found or file missing from storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: S3 storage not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/updates/updater/releases:
    get:
      tags: [Updater]
      summary: List updater releases
      description: Returns updater releases ordered by `published_at` descending.
      security:
        - AdminKey: []
      responses:
        "200":
          description: Updater releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpdaterRelease'
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Updater]
      summary: Publish an updater release
      description: |
        Uploads the signed installer to the updates bucket under
        `S3_UPDATER_PREFIX` and records the release. SHA-256 and size are
        computed server-side from the uploaded bytes, so the manifest checksum
        always describes what is actually served — compare it against
        `Get-FileHash -Algorithm SHA256` on the CI artefact.

        With `is_current=true` the release is served immediately and whichever
        release previously held the slot is demoted, atomically.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [version, file]
              properties:
                version:
                  type: string
                  description: Semver with no `v` prefix; must equal the installer's `ApplicationVersion`
                  example: "1.5.0"
                file:
                  type: string
                  format: binary
                  description: The signed `EMLyUpdater_Installer_<version>.exe`
                is_current:
                  type: string
                  description: "`true`/`1` to serve this build from the manifest right away"
                  example: "true"
                notes_it:
                  type: string
                  example: "Corretta la gestione dei mapping DC/subnet multipli."
                notes_en:
                  type: string
                  example: "Fixed handling of multiple DC/subnet mappings."
                published_at:
                  type: string
                  format: date-time
                  description: RFC 3339; defaults to now
      responses:
        "201":
          description: Release published
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "1.5.0"
                  is_current:
                    type: boolean
                    example: true
                  download_filename:
                    type: string
                    example: "EMLyUpdater_Installer_1.5.0.exe"
                  sha256_checksum:
                    type: string
                    example: "3f786850e387550fdab836ed7e6dc881de23001b1f8b9a3d6e5c4a2b0f9e8d7c"
                  file_size:
                    type: integer
                    example: 4812345
        "400":
          description: Missing file, missing version, or a version that is not bare semver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: S3 storage not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/updates/updater/releases/{version}:
    patch:
      tags: [Updater]
      summary: Update an updater release
      description: |
        Partial update — only the fields present in the body are changed.
        `{"is_current": false}` on the released build is the kill-switch: the
        manifest immediately reverts to `{"version": ""}`. Setting it to `true`
        demotes whichever release held the slot.
      security:
        - AdminKey: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: "1.5.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_current:
                  type: boolean
                  example: false
                notes_it:
                  type: string
                  description: Empty string clears the note
                notes_en:
                  type: string
                  description: Empty string clears the note
                published_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Updated release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdaterRelease'
        "400":
          description: Invalid JSON, no fields to update, or a non-RFC3339 `published_at`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Updater]
      summary: Delete an updater release
      description: Removes both the stored installer and the release row.
      security:
        - AdminKey: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: "1.5.0"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
        "404":
          description: Version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: S3 storage not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/config:
    get:
      tags: [Config]
      summary: Get the published remote configuration document
      description: |
        Fetched by the EMLy Updater and by EMLy on the same hosts and the same
        auth as the updater manifest. Returns the currently published
        `remote_config_revisions` row byte for byte (the body is written
        straight from the stored column, never re-encoded, so it always
        matches the `ETag`).

        204, never 404, when nothing has been published yet. The
        client treats any 4xx as an outage worth logging; 204 says
        "reachable, nothing to give you, keep what you have" instead - the
        same reasoning behind the updater manifest's 200 {"version": ""}.

        Cache-Control:no-cache means every fetch revalidates via
        If-None-Match; a weak validator (W/"...") or a comma-separated
        list is accepted, since a proxy in front of a mirror may merge or
        weaken validators.
      security:
        - ApiKey: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          example: '"a1b2c3..."'
      responses:
        "200":
          description: The published document
          headers:
            ETag:
              schema:
                type: string
            X-Config-Revision:
              schema:
                type: integer
              description: Convenience for logs/curl; not part of the client contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteConfigDocument'
        "304":
          description: Cache is current (If-None-Match matched)
        "204":
          description: Reachable, nothing published yet
        "401":
          description: Missing or wrong API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/config/validate:
    post:
      tags: [Config]
      summary: Validate a document without storing it
      description: Runs the same validation a publish would (structural typing, referential integrity, override dry-run) and stores nothing. For CI pipelines and a dashboard's check button.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  $ref: '#/components/schemas/RemoteConfigDocument'
      responses:
        "200":
          description: Valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Problem'
        "422":
          description: Invalid - every problem found, not just the first
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  problems:
                    type: array
                    items:
                      $ref: '#/components/schemas/Problem'
        "401":
          description: Missing or wrong admin key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/config/preview:
    post:
      tags: [Config]
      summary: Preview the effective policy for a given host
      description: |
        Exactly one of revision (a stored revision) or document (inline,
        validated first, never stored) is required. Returns the effective
        document for host (global document with matching overrides
        applied), the ids of the overrides that applied, the dcLookupMap
        site matched (or null meaning defaultServer) and its resolver chain.
        host.now defaults to the server clock.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision:
                  type: integer
                  format: int64
                  nullable: true
                document:
                  $ref: '#/components/schemas/RemoteConfigDocument'
                host:
                  type: object
                  properties:
                    hwid:
                      type: string
                    hostname:
                      type: string
                    dc:
                      type: string
                    ips:
                      type: array
                      items:
                        type: string
                    domain:
                      type: string
                    now:
                      type: string
                      format: date-time
                      nullable: true
      responses:
        "200":
          description: Effective policy for the given host
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    type: integer
                    format: int64
                  effective_document:
                    $ref: '#/components/schemas/RemoteConfigDocument'
                  applied_override_ids:
                    type: array
                    items:
                      type: string
                  matched_site:
                    type: string
                    nullable: true
                  resolver_chain:
                    type: array
                    items:
                      type: string
        "400":
          description: Neither or both of revision/document were given
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Revision not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Inline document is invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  problems:
                    type: array
                    items:
                      $ref: '#/components/schemas/Problem'

  /v2/config/revisions:
    get:
      tags: [Config]
      summary: List revisions (metadata only, newest first)
      security:
        - AdminKey: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RemoteConfigRevisionStatus'
      responses:
        "200":
          description: Paginated revision list
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/RemoteConfigRevisionSummary'
    post:
      tags: [Config]
      summary: Create a new draft revision (optionally publishing it immediately)
      description: |
        document must not carry revision/generatedAt - both are
        assigned here; a submitted value is reported as a warning, not an
        error. Fields the schema doesn't recognize are dropped by the
        canonical round-trip and reported as warnings too, so a typo in a
        field name isn't silently lost. 405 on a site mirror
        (CONFIG_UPSTREAM_URL set) - publish upstream instead.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  $ref: '#/components/schemas/RemoteConfigDocument'
                notes:
                  type: string
                  nullable: true
                publish:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Created (and published, if requested)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RemoteConfigRevision'
                  - type: object
                    properties:
                      warnings:
                        type: array
                        items:
                          $ref: '#/components/schemas/Problem'
        "405":
          description: This instance is a site mirror; publish upstream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "413":
          description: Document exceeds the 1 MiB size cap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Invalid document - every problem found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  problems:
                    type: array
                    items:
                      $ref: '#/components/schemas/Problem'

  /v2/config/revisions/{revision}:
    get:
      tags: [Config]
      summary: Get one revision with its full document
      security:
        - AdminKey: []
      parameters:
        - name: revision
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteConfigRevision'
        "404":
          description: Revision not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Config]
      summary: Delete a draft revision
      description: Only draft rows can be deleted (409 otherwise); it does not free the revision number. 405 on a site mirror.
      security:
        - AdminKey: []
      parameters:
        - name: revision
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
        "404":
          description: Revision not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "405":
          description: This instance is a site mirror
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Only draft revisions can be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/config/revisions/{revision}/publish:
    post:
      tags: [Config]
      summary: Publish a draft revision
      description: Supersedes whatever is currently published. 409 if the revision isn't a draft, or if a newer revision has been published since it was created. 405 on a site mirror.
      security:
        - AdminKey: []
      parameters:
        - name: revision
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteConfigRevision'
        "404":
          description: Revision not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "405":
          description: This instance is a site mirror
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Already published, superseded, or overtaken by a newer publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/config/rollback:
    post:
      tags: [Config]
      summary: Roll back by republishing an old revision's content under a new, higher revision
      description: |
        The only rollback mechanism - republishing the old revision itself
        would hand the fleet a lower number than what it already has, and
        every client ignores it. The source content is re-validated on the
        way, so a rule tightened since it was written surfaces here as 422
        rather than as a fleet-wide rejection. 405 on a site mirror.
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: integer
                  format: int64
                  description: Revision to clone content from (any status except draft)
                notes:
                  type: string
                  nullable: true
      responses:
        "201":
          description: New revision created and published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteConfigRevision'
        "400":
          description: "to is required"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Source revision not found, or is still a draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "405":
          description: This instance is a site mirror
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Source revision no longer validates under the current rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  problems:
                    type: array
                    items:
                      $ref: '#/components/schemas/Problem'
